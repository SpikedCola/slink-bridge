; S-Link / Control A1 bridge for the Sony STR-DB930.
;
; Pick the board by environment. Pins for each board are in include/board.h.
;   s2mini       LOLIN ESP32-S2 Mini v1.0.0  TX GPIO16, RX GPIO18  (working)
;   c3supermini  ESP32-C3 SuperMini          TX GPIO3,  RX GPIO4   (working)
;
; Build:          pio run -e s2mini        (also writes slink-bridge-s2mini-full.bin)
; First flash:    flash slink-bridge-<env>-full.bin at 0x0 (web.esphome.io), or
;                 pio run -e s2mini -t upload over USB
; Later, WiFi:    pio run -e s2mini_ota -t upload --upload-port <ip>

[platformio]
; OTA password lives here (git-ignored); copy secrets.ini.example to start
extra_configs = secrets.ini

[env]
; 6.x = Arduino core 2.x / IDF 4.4, which has the legacy RMT driver
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
extra_scripts = post:merge_bin.py

[ota]
upload_protocol = espota
upload_port = slink.local
; upload_flags = --auth=<OTA_PASS> comes from secrets.ini

[env:s2mini]
board = lolin_s2_mini
build_flags = -DBOARD_S2_MINI -DARDUINO_USB_CDC_ON_BOOT=1

[env:s2mini_ota]
extends = env:s2mini, ota

[env:c3supermini]
board = esp32-c3-devkitm-1
build_flags = -DBOARD_C3_SUPERMINI -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3supermini_ota]
extends = env:c3supermini, ota
